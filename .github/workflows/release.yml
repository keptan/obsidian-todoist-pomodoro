name: Release Obsidian plugin

on:
    push:
        tags:
            - '*'

jobs:
    build:
        runs-on: ubuntu-latest
        permissions:
            contents: write
            id-token: write
            attestations: write
        steps:
            - uses: actions/checkout@v6

            - name: Use Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: 24
                  cache: 'npm'

            - name: Validate release version
              env:
                  RELEASE_TAG: ${{ github.ref_name }}
              run: |
                  node --input-type=module <<'JS'
                  import fs from 'node:fs';
                  const read = path => JSON.parse(fs.readFileSync(path, 'utf8'));
                  const manifest = read('manifest.json');
                  const lock = read('package-lock.json');
                  const tag = process.env.RELEASE_TAG;
                  if (!/^\d+\.\d+\.\d+$/.test(tag) || [manifest.version, read('package.json').version, lock.version, lock.packages[''].version].some(version => version !== tag)) {
                    throw new Error('Release tag must match manifest and package versions without a leading v.');
                  }
                  if (read('versions.json')[tag] !== manifest.minAppVersion) throw new Error('Missing or mismatched versions.json entry.');
                  JS

            - name: Build plugin
              run: |
                  npm ci
                  npm test
                  npm run lint
                  npm run build

            - name: Check for optional styles
              id: styles
              run: |
                  [ -f styles.css ] && echo "exists=true" >> "$GITHUB_OUTPUT" || echo "exists=false" >> "$GITHUB_OUTPUT"

            - name: Attest build provenance
              uses: actions/attest@v4
              with:
                  subject-path: |
                      main.js
                      ${{ steps.styles.outputs.exists == 'true' && 'styles.css' || '' }}

            - name: Create release
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  tag="${GITHUB_REF#refs/tags/}"
                  notes_file="release-notes/$tag.md"
                  if [ -f "$notes_file" ]; then
                    notes=(--notes-file "$notes_file")
                  else
                    notes=(--generate-notes)
                  fi

                  gh release create "$tag" \
                    --title="$tag" \
                    --verify-tag --latest "${notes[@]}" \
                    main.js manifest.json ${{ steps.styles.outputs.exists == 'true' && 'styles.css' || '' }}
